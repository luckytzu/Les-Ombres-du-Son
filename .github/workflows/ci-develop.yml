name: CI/CD - Develop

on:
  push:
    branches:
      - develop

jobs:
  build-and-distribute:
    name: Build & Distribute to Testers
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
      
      - name: Run Android Lint
        run: ./gradlew lintDebug
        continue-on-error: true
      
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
      
      - name: Generate JaCoCo Coverage Report
        run: ./gradlew jacocoTestReport
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-develop
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      # Firebase App Distribution
      - name: Distribute to Firebase (Testers Group)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            🚀 Nouvelle version de développement
            
            Branch: develop
            Commit: ${{ github.sha }}
            Auteur: ${{ github.actor }}
            
            Changements:
            ${{ github.event.head_commit.message }}
      
      - name: Comment on commit
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            ✅ **Build réussi et distribué !**
            
            📱 L'APK a été distribué au groupe "testers" via Firebase App Distribution.
            Les testeurs recevront une notification pour télécharger la nouvelle version.
            
            📊 [Voir les rapports de qualité sur SonarCloud](https://sonarcloud.io/project/overview?id=luckytzu_Les-Ombres-du-Son)
