name: CI - Feature Branches

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nécessaire pour SonarCloud
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          echo "Vérification du fichier google-services.json:"
          ls -la app/google-services.json
          echo "Contenu (premiers caractères):"
          head -c 100 app/google-services.json
      
      - name: Run Android Lint
        run: ./gradlew lintDebug --continue
        continue-on-error: true
      
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
      
      - name: Generate JaCoCo Coverage Report
        run: ./gradlew jacocoTestReport
      
      - name: Debug - List lint reports
        run: |
          echo "Listing lint reports directory:"
          find app/build -name "*lint*" -type f 2>/dev/null || echo "No lint files found"
          ls -la app/build/reports/ 2>/dev/null || echo "No reports directory found"
      
      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.xml
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
      
      # Reviewdog - Android Lint
      - name: Run reviewdog (Android Lint)
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      
      - name: Run Android Lint with reviewdog
        if: github.event_name == 'pull_request'
        run: |
          if [ -f "app/build/reports/lint-results-debug.xml" ]; then
            reviewdog -f=android-lint -name="Android Lint" -reporter=github-pr-review < app/build/reports/lint-results-debug.xml
          else
            echo "Lint report not found, skipping reviewdog analysis"
          fi
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # SonarCloud Analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage
      
      - name: Check Coverage Threshold
        run: |
          echo "Vérification du seuil de couverture de code..."
          # TODO: Ajouter un script pour vérifier le seuil minimum (ex: 50%)
          echo "✅ Couverture de code acceptable"
