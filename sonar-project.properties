# Configuration SonarCloud pour Les Ombres du Son
sonar.projectKey=luckytzu_Les-Ombres-du-Son
sonar.organization=luckytzu

# Métadonnées du projet
sonar.projectName=Les Ombres du Son
sonar.projectVersion=1.0

# Chemins sources
sonar.sources=app/src/main/java
sonar.tests=app/src/androidTest/java

# Encodage
sonar.sourceEncoding=UTF-8

# Langage
sonar.language=java

# Exclusions
sonar.exclusions=**/R.java,\
  **/*.xml,\
  **/BuildConfig.java,\
  **/Manifest*.java,\
  **/*Test*.java,\
  **/test/**,\
  **/androidTest/**

# Exclusions de couverture
sonar.coverage.exclusions=**/R.java,\
  **/*.xml,\
  **/BuildConfig.java,\
  **/Manifest*.java,\
  **/*Test*.java,\
  **/test/**,\
  **/androidTest/**,\
  **/*Activity.java,\
  **/*Fragment.java

# Rapports JaCoCo
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# Rapports Android Lint
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml

# Binaires compilés
sonar.java.binaries=app/build/tmp/kotlin-classes/debug

# Seuils de qualité
sonar.qualitygate.wait=true

# Liens
sonar.links.homepage=https://github.com/luckytzu/Les-Ombres-du-Son
sonar.links.ci=https://github.com/luckytzu/Les-Ombres-du-Son/actions
sonar.links.scm=https://github.com/luckytzu/Les-Ombres-du-Son
sonar.links.issue=https://github.com/luckytzu/Les-Ombres-du-Son/issues
